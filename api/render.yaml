services:
  - type: web
    name: clawvault-api
    env: node
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: clawvault-db
          property: connectionString
      - key: PORT
        value: 3001
      - key: NODE_ENV
        value: production

databases:
  - name: clawvault-db
    databaseName: clawvault
    user: clawvault